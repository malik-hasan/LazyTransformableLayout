[versions]
android-minSdk = "23"
android-targetSdk = "37"

android = "9.3.2" # https://kotlinlang.org/docs/multiplatform-compatibility-guide.html#version-compatibility
kotlin = "2.4.10"
maven-publish = "0.37.0"

activity-compose = "1.13.0"
androidx-compose-bom = "2026.08.00"
jetbrains-compose = "1.12.0"
kermit = "2.1.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "android" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android" }

kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "jetbrains-compose" }

kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
